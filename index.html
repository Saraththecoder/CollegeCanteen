<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport (keep only one) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Verification -->
    <meta name="google-site-verification" content="TtIXWFoIpLgN1d-CwjeI10BcrdhdrzqMhVKvBqZgJxs" />

    <!-- Primary SEO -->
    <title>AITS College Canteen Menu | Prices, Timings & Food List</title>

    <meta name="description" content="Explore AITS college canteen menu, daily specials, food prices, and timings. Affordable and fresh meals for students.">

    <meta name="keywords" content="AITS canteen, college canteen menu, student food, canteen prices, campus food">

    <meta name="author" content="AITS College">

    <meta name="robots" content="index, follow">

    <!-- Canonical -->
    <link rel="canonical" href="https://aitscanteen1.netlify.app/" />

    <!-- Open Graph (for sharing) -->
    <meta property="og:title" content="AITS College Canteen Menu">
    <meta property="og:description" content="Check menu, prices, and timings of AITS college canteen">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-actual-site-url.com/">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              noir: '#000000',
              blanc: '#FFFFFF',
              gray: {
                50: '#F9F9F9',
                100: '#F0F0F0',
                200: '#E5E5E5',
                300: '#D4D4D4',
                400: '#A3A3A3',
                500: '#737373',
                600: '#525252',
                700: '#404040',
                800: '#262626',
                900: '#171717',
              }
            }
          }
        }
      }
    </script>

    <!-- Structured Data (SEO boost) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "AITS College Canteen",
      "servesCuisine": "Indian",
      "priceRange": "₹",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "India"
      }
    }
    </script>

    <!-- React Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
        "firebase/": "https://esm.sh/firebase@^12.9.0/",
        "qrcode.react": "https://esm.sh/qrcode.react@^4.2.0"
      }
    }
    </script>

  </head>

  <body class="bg-gray-50 dark:bg-black text-black dark:text-white antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
